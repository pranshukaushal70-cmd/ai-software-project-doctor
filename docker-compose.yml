name: project-doctor

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Credentials come from the root .env (see .env.example); there is no default password.
    # POSTGRES_* only take effect when the data volume is first created.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doctor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-project_doctor}
    # Published on localhost only, so the database is not reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    # Redis has no password here, so it must stay on localhost.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # "web" and "worker" services are added in Phase 10 (Dockerised web/worker, CI),
  # once their Dockerfiles exist.

volumes:
  pgdata:
  redisdata:
