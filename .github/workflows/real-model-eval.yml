# Real-model evaluation of the planner and code engine (Phase 10, docs/benchmark.md).
#
# MANUAL ONLY: there is deliberately no push, pull_request or schedule trigger, so it never
# runs for pull requests or forks. Only people with write access can start it, and the
# secret lives in the "real-model-eval" environment (add required reviewers there to make
# every run need an approval). Each run costs API credits.
#
# The results are measurements, not a test: this workflow fails only if the harness or the
# stack fails, never because of a success rate. Results are uploaded as an artifact.
name: Real-model evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: Anthropic model id the planner and code engine use
        required: true
        default: claude-opus-5-5
      repetitions:
        description: Repetitions of the task set (1–3)
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3"]
      run_tests:
        description: Run the fixtures' tests in the sandbox (worker gets the runner's Docker socket)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: real-model-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: real-model-eval
    env:
      PD_STACK: eval
      E2E_SANDBOX: ${{ inputs.run_tests && '1' || '0' }}
      ANTHROPIC_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the inputs
        env:
          MODEL: ${{ inputs.model }}
        run: |
          [[ "$MODEL" =~ ^[a-z0-9][a-z0-9.-]{1,63}$ ]] || { echo "Invalid model id"; exit 1; }
      - run: npm ci
      - name: Build the images and start the evaluation stack
        env:
          # Passed to the containers by compose interpolation only; never written to a file.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run e2e:up
      - name: Evaluate
        run: npm run bench:agent -- --label real-model --repetitions ${{ inputs.repetitions }} --out results/ci ${{ inputs.run_tests && '--run-tests' || '' }}
      - name: Summary
        if: always()
        run: cat benchmarks/results/ci/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-model-eval-${{ github.run_id }}
          path: benchmarks/results/ci
          if-no-files-found: ignore
          retention-days: 90
      - name: Stop the stack
        if: always()
        run: npm run e2e:down
